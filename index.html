<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>8¾ Ball</title><style>
    :root { color-scheme: dark; --bg: #210d12; --text: #fff0de; --muted: #e2c8b7; --gold: #ffc96d; --line: #6a4045; }
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.7 system-ui, sans-serif; }
    main { max-width: 43rem; margin: auto; padding: clamp(1.25rem, 5vw, 3rem); }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; padding-block-end: 1rem; border-block-end: 1px solid var(--line); }
    a { color: var(--gold); text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    section { padding-block: 2rem; scroll-margin-block-start: 1rem; }
    section + section { border-block-start: 1px solid var(--line); }
    h1, h2 { line-height: 1.25; }
    h1 { font-size: clamp(1.9rem, 6vw, 2.75rem); margin: .25rem 0 1rem; }
    h2 { font-size: 1.2rem; margin: 1.75rem 0 .4rem; }
    p { margin: .3rem 0 .9rem; }
    .brand { font-weight: 700; color: var(--gold); }
    .date { color: var(--muted); font-size: .9rem; }
  </style></head>
<body><main><p class="brand">8¾ Ball</p><h1>A magical fortune ball for iPhone</h1>
<p><a href="support/">Support · תמיכה</a></p><p><a href="privacy/">Privacy Policy · מדיניות פרטיות</a></p></main></body></html>
